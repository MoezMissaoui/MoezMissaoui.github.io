#Update all the sections by editing the data.yml file inside _data folder.

# Site Settings
title: Moez Missaoui
url: 'https://moezmissaoui.github.io'

#change it according to your repository name
# disabling since we are using a custom domain
#baseurl: '/online-cv' 

description: My name is Moez Missaoui , and I'm a passionate web developer with years of experience in the tech industry.
# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: ceramic # blue turquoise green berry orange ceramic
chrome_mobile_color: 4B6A78 #use hex colors (ex:1976d2) or leave empty if you don't want a color for chrome mobile searchbar

# Tracker
analytics: G-QH5H4CGV5S

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4001
host: 127.0.0.1
safe: false
